{% extends "core/base.html" %}
{% load static %}
{% block content %}
    <video autoplay muted loop playsinline webkit-playsinline class="bg-video">
        <source src="{% static 'core/login.mp4' %}" type="video/mp4">
    </video>
    <h1 class="text-center" style="margin-bottom: 20px !important;">LOGIN</h1>
    <form action="{% url 'core:login' %}" method="post">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom: 20px !important;">
            <input class="form-control" type="text" name="username" placeholder="Username">
        </div>
        <div class="form-group" style="margin-bottom: 20px !important;">
            <input class="form-control" type="password" name="password" placeholder="Password">
        </div>
        <input class="btn btn-primary justify-content-center" type="submit" value="Login">
        {% if message %}
        <p style="color: red;">{{ message }}</p>
        {% endif %}
    </form>

{% endblock content %}
