{% extends "core/base.html" %}
{% load static %}
{% block navbar_extra %}
    <form class="d-flex" method="POST" action="{% url 'core:search' %}">
        {% csrf_token %}
        <input class="form-control me-2" type="search" placeholder="Search Games" name="searched">
    </form>
{% endblock navbar_extra %}
{% block content %}
    <video autoplay muted loop playsinline webkit-playsinline class="bg-video">
        <source src="{% static 'core/bg.mp4' %}" type="video/mp4">
    </video>
    <div class="justify-content-center"> 
        <div class="game-container" style="position: relative; width: 100%; height: 0; overflow: hidden; border-radius: 8px; background: #f0f0f0;">
            <iframe seamless="seamless" allowtransparency="true" allowfullscreen="true"
            frameborder="0" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0px;" src="{{ game.iframe }}"></iframe>
        </div>
    </div>
{% endblock content %}
