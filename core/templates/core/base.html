{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PowerGames{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'core/istockphoto.jpg' %}">
    {% block head %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <!-- Logo on the left -->
            <a class="navbar-brand" href="{% url 'core:home' %}">
            <strong>PowerGames</strong>
            </a>

            <!-- Toggler for mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links + search on the right -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav me-3"> <!-- me-3 adds spacing between links and search -->
                <li class="nav-item">
                <a class="nav-link" href="{% url 'core:home' %}"><strong>Home</strong></a>              
                </li>
                <li class="nav-item">
                <a class="nav-link" href="{% url 'core:game' %}">All Games</a>
                </li>
            </ul>

            <form class="d-flex" method="POST" action="{% url 'core:search' %}">
                {% csrf_token %}
                <input class="form-control me-2" type="search" placeholder="Search Games" name="searched">
            </form>
            </div>
        </div>
    </nav>






    <!-- Main Content -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center py-4 mt-auto">
        <div class="container">
            <p class="text-muted mb-0">&copy; 2026 PowerGames. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
