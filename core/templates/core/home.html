{% extends 'core/base.html' %}
{% load static %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<!-- Hero Section -->
<div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary">{{ title }}</h1>
    <p class="lead text-muted">{{ message }}</p>
</div>
{% for game in games %}
    <div>       
        <iframe src="{{ game.iframe }}" width="100%" height="300" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>
{% endfor %}       
{% endblock %}
