{% extends 'core/base.html' %}
{% load static %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<!-- Hero Section -->
<div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary">{{ title }}</h1>
    <p class="lead text-muted">{{ message }}</p>
</div>
{% for game in games %}
    <div>       
        <iframe seamless="seamless" allowtransparency="true" allowfullscreen="true" \
        frameborder="0" style="width: 100%;height: 100%;border: 0px;" src="{{ game.iframe }}"> </iframe>
    </div>
{% endfor %}       
{% endblock %}
